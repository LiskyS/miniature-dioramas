<script type="importmap">
{

<body>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   京华夜梦 — a 40 m miniature of Beijing, seen on a 2.5° lens
   Level camera, lens shift only. No tilt, no UI, no post.
   ============================================================ */

const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RNG = mulberry32(0x0BE1A1 ^ 20241114);
const rnd = (a = 0, b = 1) => a + (b - a) * RNG();
const pick = arr => arr[Math.floor(RNG() * arr.length)];

/* ---------- renderer, scene, camera ---------- */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  stencil: false,
  powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = false;
renderer.setClearColor(0x05060e, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060e);
scene.fog = new THREE.FogExp2(0x090b1a, 0.00062);
const skyRig = new THREE.Group();
skyRig.name = 'skyRig';
scene.add(skyRig);

const FOV = 2.5;                 // vertical. never changes.
const TAN_HALF = Math.tan(FOV * 0.5 * D2R);
const HEIGHT_FACTOR = 0.18;      // camera height / orbit radius (level camera)
const BASE_SCREEN_Y = 0.64;      // where the ground centre sits, 0 top .. 1 bottom
const DIST_MIN = 350, DIST_MAX = 700;
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 5, 2600);
camera.up.set(0, 1, 0);
camera.layers.enable(1); // weather, stars, fireworks; excluded from the reflection camera

const cam = {
  az: -0.085,
  azTarget: -0.085,
  dist: 500,
  distTarget: 500,
  panX: 0, panZ: 0,
  panXTarget: 0, panZTarget: 0,
  auto: true,
  lastInput: -99,
};
window.THREE = THREE;
window.__cam = cam;
window.__camera = camera;
window.__renderer = renderer;
window.__scene = scene;
window.__pause = false;
window.__setCam = (d, az) => {
  cam.dist = cam.distTarget = clamp(d, DIST_MIN, DIST_MAX);
  if (az !== undefined) cam.az = cam.azTarget = az;
  cam.lastInput = 1e9;
  placeCamera();
  renderer.render(scene, camera);
};
window.__project = (x, y, z) => {
  const v = new THREE.Vector3(x, y, z).project(camera);
  return { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight, ndc: v.toArray() };
};
window.__camInfo = () => ({
  pos: camera.position.toArray(),
  view: camera.view,
  matrix: camera.projectionMatrix.elements.slice(),
});

const FULL_VIEW = 2000;
function applyLensShift() {
  // Compose with a vertical lens shift, not a tilt: setViewOffset selects a
  // frame far below the optical axis. Verticals stay vertical.
  // fullWidth must follow the canvas aspect: setViewOffset overwrites aspect.
  const dep = Math.atan2(cam.dist * HEIGHT_FACTOR, cam.dist);
  const y0 = -Math.tan(dep) / TAN_HALF;
  const want = 1 - 2 * BASE_SCREEN_Y;
  const ndc = want - y0;
  const fullW = FULL_VIEW * camera.aspect;
  camera.setViewOffset(fullW, FULL_VIEW, 0, ndc * FULL_VIEW * 0.5, fullW, FULL_VIEW);
}
function placeCamera() {
  const R = cam.dist;
  const H = R * HEIGHT_FACTOR;
  camera.position.set(
    cam.panX + Math.sin(cam.az) * R,
    H,
    cam.panZ + Math.cos(cam.az) * R
  );
  camera.lookAt(cam.panX, H, cam.panZ); // perfectly horizontal
  applyLensShift();
  camera.updateMatrixWorld();
  if (typeof skyRig !== 'undefined') {
    skyRig.position.copy(camera.position);
    skyRig.quaternion.copy(camera.quaternion);
  }
}
placeCamera();

/* ---------- palette / lights ---------- */
const COL = {
  ink: 0x05060d,
  night: 0x070912,
  indigo: 0x101528,
  slate: 0x1b2236,
  slate2: 0x27304a,
  stone: 0x2f3448,
  paper: 0xf2dfb8,
  amber: 0xffb765,
  amberHot: 0xffd79a,
  vermilion: 0xb83a32,
  red: 0xd84a3e,
  jade: 0x3f7d72,
  teal: 0x2a6470,
  cyan: 0x66d7e6,
  blue: 0x3c6ea8,
  plum: 0x5b3a5e,
  cream: 0xe8dcc2,
  gold: 0xc99a52,
};

const hemi = new THREE.HemisphereLight(0x6b7bc4, 0x0a0812, 1.55);
scene.add(hemi);
const moonLight = new THREE.DirectionalLight(0xb9caff, 3.0);
moonLight.position.set(-95, 160, 110);
scene.add(moonLight);
const fill = new THREE.DirectionalLight(0xa06f86, 0.55);
fill.position.set(90, 35, -70);
scene.add(fill);

/* ---------- toon gradient (3 steps) ---------- */
function makeGradient(steps) {
  const data = new Uint8Array(steps.length * 4);
  steps.forEach((v, i) => {
    data[i * 4 + 0] = data[i * 4 + 1] = data[i * 4 + 2] = Math.round(v * 255);
    data[i * 4 + 3] = 255;
  });
  const t = new THREE.DataTexture(data, steps.length, 1, THREE.RGBAFormat);
  t.minFilter = THREE.NearestFilter;
  t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}
const GRADIENT = makeGradient([0.2, 0.55, 1.0]); // three hard toon bands

/* ---------- shared snow uniforms ---------- */
const uSnow = { value: 0 };
const uSnowTint = { value: new THREE.Color(0xd3dff2) };
const snowShaders = [];

function addSnow(material, strength = 1.0) {
  material.userData.snowStrength = strength;
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uSnow = uSnow;
    shader.uniforms.uSnowTint = uSnowTint;
    shader.uniforms.uSnowStrength = { value: strength };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vSnowWorld;
        varying vec3 vSnowNormal;`)
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        #ifdef USE_INSTANCING
          vSnowWorld = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
          vSnowNormal = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * objectNormal);
        #else
          vSnowWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;
          vSnowNormal = normalize(mat3(modelMatrix) * objectNormal);
        #endif`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uSnow;
        uniform vec3 uSnowTint;
        uniform float uSnowStrength;
        varying vec3 vSnowWorld;
        varying vec3 vSnowNormal;
        float snowHash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float snowUp = smoothstep(0.28, 0.82, normalize(vSnowNormal).y);
        float sn = snowHash(floor(vSnowWorld.xz * 2.7));
        float amount = uSnow * uSnowStrength * 1.45;
        float cover = smoothstep(0.55 - sn * 0.22, 0.92 - sn * 0.18, snowUp * amount);
        cover *= smoothstep(0.0, 0.08, uSnow);
        diffuseColor.rgb = mix(diffuseColor.rgb, uSnowTint, cover * 0.82);`);
    snowShaders.push(shader);
  };
  material.customProgramCacheKey = () => 'snow-toon';
  return material;
}

function toon(color, opts = {}) {
  const { snow, snowStrength, ...matOpts } = opts;
  const m = new THREE.MeshToonMaterial({
    color,
    gradientMap: GRADIENT,
    ...matOpts,
  });
  if (snow !== false) addSnow(m, snowStrength ?? 1);
  return m;
}
function basic(color, opts = {}) {
  return new THREE.MeshBasicMaterial({ color, toneMapped: false, ...opts });
}

/* ---------- outline material ---------- */
const OUTLINE_WIDTH = { value: 0.000105 };
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { uWidth: OUTLINE_WIDTH, uColor: { value: new THREE.Color(0x04050b) } },
  vertexShader: /* glsl */`
    uniform float uWidth;
    void main() {
      vec3 n = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      mv.xyz += n * (-mv.z) * uWidth;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uColor;
    void main() { gl_FragColor = vec4(uColor, 1.0); }`,
  side: THREE.BackSide,
  depthWrite: true,
});
function addOutline(parent, geo, matrix = null) {
  const m = new THREE.Mesh(geo, outlineMat);
  if (matrix) { m.matrix.copy(matrix); m.matrixAutoUpdate = false; }
  parent.add(m);
  return m;
}

/* ---------- textures ---------- */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function texFrom(canvas, { nearest = false, srgb = true, repeat = null } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (nearest) {
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestMipmapLinearFilter;
  } else {
    t.magFilter = THREE.LinearFilter;
    t.minFilter = THREE.LinearMipmapLinearFilter;
  }
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  t.needsUpdate = true;
  return t;
}

const glowTex = (() => {
  const c = makeCanvas(128, 128), x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,255,255,0.72)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.26)');
  g.addColorStop(0.78, 'rgba(255,255,255,0.05)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return texFrom(c);
})();

const softRoundTex = (() => {
  const c = makeCanvas(64, 64), x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.8, 'rgba(255,255,255,0.15)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return texFrom(c);
})();

/* ---------- sky dome ---------- */
function buildSky() {
  const c = makeCanvas(2048, 1024), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1024);
  g.addColorStop(0.00, '#02030a');
  g.addColorStop(0.34, '#04050f');
  g.addColorStop(0.47, '#070819');
  g.addColorStop(0.52, '#0a0b1e');
  g.addColorStop(0.56, '#0f0d22');
  g.addColorStop(0.62, '#080814');
  g.addColorStop(1.00, '#020309');
  x.fillStyle = g; x.fillRect(0, 0, 2048, 1024);

  // restrained painted nebulae, mostly above the visible band
  for (let i = 0; i < 9; i++) {
    const px = rnd(0, 2048), py = rnd(430, 560), rr = rnd(220, 560);
    const ng = x.createRadialGradient(px, py, 0, px, py, rr);
    const hue = pick(['72,61,102', '41,55,95', '96,62,78']);
    ng.addColorStop(0, `rgba(${hue},0.07)`);
    ng.addColorStop(0.55, `rgba(${hue},0.02)`);
    ng.addColorStop(1, `rgba(${hue},0)`);
    x.fillStyle = ng; x.fillRect(px - rr, py - rr, rr * 2, rr * 2);
  }
  // a narrow, warm city glow at the horizon
  const hg = x.createLinearGradient(0, 505, 0, 585);
  hg.addColorStop(0, 'rgba(150,92,102,0)');
  hg.addColorStop(0.45, 'rgba(130,78,88,0.10)');
  hg.addColorStop(0.7, 'rgba(88,56,78,0.06)');
  hg.addColorStop(1, 'rgba(60,40,70,0)');
  x.fillStyle = hg; x.fillRect(0, 505, 2048, 80);

  const tex = texFrom(c);
  tex.wrapS = THREE.RepeatWrapping;
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(1800, 64, 40),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false })
  );
  sky.rotation.y = 0.6;
  sky.renderOrder = -100;
  sky.layers.set(1);
  skyRig.add(sky);
  return sky;
}
buildSky();

// low moon, a flat ivory disc in the same world-space sky
(function addMoon() {
  const c = makeCanvas(256, 256), x = c.getContext('2d');
  const g = x.createRadialGradient(118, 108, 8, 128, 128, 120);
  g.addColorStop(0, '#fff6dc');
  g.addColorStop(0.62, '#f1dfba');
  g.addColorStop(0.93, '#d8c39d');
  g.addColorStop(1, 'rgba(216,195,157,0)');
  x.fillStyle = g; x.beginPath(); x.arc(128, 128, 120, 0, Math.PI * 2); x.fill();
  // soft maria, no hard cartoon craters
  for (const [mx, my, mr] of [[92, 88, 34], [158, 150, 42], [148, 70, 24], [78, 172, 26]]) {
    const mg = x.createRadialGradient(mx, my, 0, mx, my, mr);
    mg.addColorStop(0, 'rgba(150,140,120,0.12)');
    mg.addColorStop(0.65, 'rgba(150,140,120,0.05)');
    mg.addColorStop(1, 'rgba(150,140,120,0)');
    x.fillStyle = mg;
    x.beginPath(); x.arc(mx, my, mr, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1;
  const tex = texFrom(c);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xffe3b0, transparent: true, opacity: 0.23,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false,
  }));
  halo.scale.set(52, 52, 1);
  halo.position.set(-30, -252, -1600);
  halo.renderOrder = -81;
  halo.name = 'moonHalo';
  halo.layers.set(1);
  skyRig.add(halo);
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, color: 0xffffff, transparent: true, depthWrite: false, fog: false, toneMapped: false,
  }));
  moon.scale.set(8.2, 8.2, 1);
  moon.position.copy(halo.position);
  moon.renderOrder = -80;
  moon.name = 'moon';
  moon.layers.set(1);
  skyRig.add(moon);
})();

// stars: world space, concentrated in the strip the lens sees
(() => {
  const N = 1600;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), siz = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const th = rnd(0, Math.PI * 2);
    const y = rnd(-325, -205);
    const rr = Math.sqrt(Math.max(0, 1720 * 1720 - y * y));
    pos[i * 3] = Math.cos(th) * rr;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = Math.sin(th) * rr;
    const c = pick([[0.72, 0.82, 1], [1, 0.92, 0.76], [0.9, 0.86, 1]]);
    col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
    siz[i] = rnd(1.3, 4.0);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uDpr: { value: renderer.getPixelRatio() } },
    vertexShader: /* glsl */`
      attribute vec3 aColor; attribute float aSize;
      uniform float uTime, uDpr;
      varying vec3 vC; varying float vA;
      void main() {
        vC = aColor;
        vA = 0.5 + 0.5 * sin(uTime * 1.7 + position.x * 0.07 + position.z * 0.05);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uDpr;
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vC; varying float vA;
      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float a = smoothstep(0.5, 0.0, length(p));
        gl_FragColor = vec4(vC, a * (0.35 + 0.6 * vA));
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.renderOrder = -90;
  pts.layers.set(1);
  pts.name = 'stars';
  skyRig.add(pts);
  window.__stars = mat;
})();

/* ---------- world root / height map ---------- */
const world = new THREE.Group();
scene.add(world);
window.__world = world;

const HM = { n: 96, cell: 40 / 96, data: new Float32Array(96 * 96) };
for (let i = 0; i < HM.data.length; i++) HM.data[i] = 0;
function markHeight(cx, cz, w, d, top, rot = 0) {
  const c = Math.cos(-rot), s = Math.sin(-rot);
  const rad = Math.hypot(w, d) * 0.5;
  const i0 = clamp(Math.floor((cx - rad + 20) / HM.cell), 0, HM.n - 1);
  const i1 = clamp(Math.ceil((cx + rad + 20) / HM.cell), 0, HM.n - 1);
  const j0 = clamp(Math.floor((cz - rad + 20) / HM.cell), 0, HM.n - 1);
  const j1 = clamp(Math.ceil((cz + rad + 20) / HM.cell), 0, HM.n - 1);
  for (let j = j0; j <= j1; j++) {
    for (let i = i0; i <= i1; i++) {
      const wx = (i + 0.5) * HM.cell - 20;
      const wz = (j + 0.5) * HM.cell - 20;
      const lx = (wx - cx) * c - (wz - cz) * s;
      const lz = (wx - cx) * s + (wz - cz) * c;
      if (Math.abs(lx) <= w * 0.5 && Math.abs(lz) <= d * 0.5) {
        const k = j * HM.n + i;
        if (HM.data[k] < top) HM.data[k] = top;
      }
    }
  }
}
function heightAt(x, z) {
  if (x < -20 || x > 20 || z < -20 || z > 20) return -3;
  const i = clamp(Math.floor((x + 20) / HM.cell), 0, HM.n - 1);
  const j = clamp(Math.floor((z + 20) / HM.cell), 0, HM.n - 1);
  return HM.data[j * HM.n + i];
}

/* ---------- base: plinth + ground ---------- */
const baseGroup = new THREE.Group();
world.add(baseGroup);
const popItems = [];
function addPop(obj, delay, dur = 1.15, drop = 1.5) {
  const baseY = obj.position.y;
  obj.position.y = baseY - drop;
  popItems.push({ obj, delay, dur, drop, baseY });
}

const matPlinth = toon(0x0b0e1b);
const matPlinthRib = toon(0x161b2c);
const matBrass = new THREE.MeshBasicMaterial({ color: 0xd3a35d, toneMapped: false });
const matPlinthTrim = new THREE.MeshBasicMaterial({ color: 0x1f2740, toneMapped: false });

(function buildPlinth() {
  const g = new THREE.Group();
  baseGroup.add(g);
  // main block
  const main = new THREE.Mesh(new THREE.BoxGeometry(40.9, 6.4, 40.9), matPlinth);
  main.position.y = -3.7;
  g.add(main);
  // upper slab / top edge
  const cap = new THREE.Mesh(new THREE.BoxGeometry(41.25, 0.55, 41.25), matPlinthTrim);
  cap.position.y = -0.28;
  g.add(cap);
  const capTop = new THREE.Mesh(new THREE.BoxGeometry(40.2, 0.18, 40.2), toon(0x1a1f33));
  capTop.position.y = -0.01;
  g.add(capTop);
  // brass lines
  for (const y of [-0.58, -5.55]) {
    for (const axis of ['x', 'z']) {
      for (const s of [-1, 1]) {
        const geo = new THREE.BoxGeometry(axis === 'x' ? 41.0 : 0.075, 0.075, axis === 'x' ? 0.075 : 41.0);
        const m = new THREE.Mesh(geo, matBrass);
        m.position.set(axis === 'x' ? 0 : s * 20.51, y, axis === 'x' ? s * 20.51 : 0);
        g.add(m);
      }
    }
  }
  // glowing seam under the lip
  const seamMat = new THREE.MeshBasicMaterial({ color: 0xf2b568, toneMapped: false, transparent: true, opacity: 0.55 });
  for (const axis of ['x', 'z']) {
    for (const s of [-1, 1]) {
      const geo = new THREE.BoxGeometry(axis === 'x' ? 40.6 : 0.035, 0.035, axis === 'x' ? 0.035 : 40.6);
      const m = new THREE.Mesh(geo, seamMat);
      m.position.set(axis === 'x' ? 0 : s * 20.35, -0.86, axis === 'x' ? s * 20.35 : 0);
      g.add(m);
    }
  }
  // vertical ribs, instanced

function makeAsphaltTexture() {
  const c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = '#14192b'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 3800; i++) {
    const l = rnd(0, 1);
    x.fillStyle = l > 0.62 ? `rgba(112,130,166,${rnd(0.02, 0.10).toFixed(3)})`
      : `rgba(4,6,14,${rnd(0.05, 0.20).toFixed(3)})`;
    const s = rnd(0.7, 2.4);
    x.fillRect(rnd(0, 512), rnd(0, 512), s, s);
  }
  for (let i = 0; i < 18; i++) {
    x.strokeStyle = `rgba(60,70,96,${rnd(0.03, 0.09).toFixed(3)})`;
    x.lineWidth = rnd(0.6, 1.6);
    x.beginPath();
    let px = rnd(0, 512), py = rnd(0, 512);
    x.moveTo(px, py);
    for (let k = 0; k < 5; k++) { px += rnd(-26, 26); py += rnd(-26, 26); x.lineTo(px, py); }
    x.stroke();
  }
  return texFrom(c, { repeat: [1, 1] });
}
function makeStoneTexture() {
  const c = makeCanvas(512, 512), x = c.getContext('2d');
  x.fillStyle = '#252a40'; x.fillRect(0, 0, 512, 512);
  const n = 4, s = 512 / n;
  for (let j = 0; j < n; j++) {
    for (let i = 0; i < n; i++) {
      x.fillStyle = `rgba(${rnd(52, 72) | 0},${rnd(56, 76) | 0},${rnd(82, 104) | 0},0.42)`;
      x.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
    }
  }
  x.strokeStyle = 'rgba(10,13,22,0.65)'; x.lineWidth = 3;
  for (let i = 0; i <= n; i++) {
    x.beginPath(); x.moveTo(i * s, 0); x.lineTo(i * s, 512); x.stroke();
    x.beginPath(); x.moveTo(0, i * s); x.lineTo(512, i * s); x.stroke();
  }
  for (let i = 0; i < 1400; i++) {
    x.fillStyle = `rgba(190,200,225,${rnd(0.01, 0.055).toFixed(3)})`;
    x.fillRect(rnd(0, 512), rnd(0, 512), rnd(0.6, 1.8), rnd(0.6, 1.8));

}

class Batch {
  constructor() { this.groups = new Map(); }
  add(geo, mat, matrix = null, outline = false) {
    const g = geo.clone();
    if (matrix) g.applyMatrix4(matrix);
    const key = mat.uuid;
    if (!this.groups.has(key)) this.groups.set(key, { mat, geos: [], outline: false });
    const b = this.groups.get(key);
    b.geos.push(g);
    if (outline) b.outline = true;
  }
  commit(parent) {
    for (const b of this.groups.values()) {
      const geos = b.geos.map(g => g.index ? g.toNonIndexed() : g);
      const merged = mergeGeometries(geos, false);
      if (!merged) continue;
      merged.computeBoundingSphere();
      parent.add(new THREE.Mesh(merged, b.mat));
      if (b.outline) parent.add(new THREE.Mesh(merged, outlineMat));
    }
  }
}

/* ---------- facade textures ---------- */
function makeFacadeStyle(cfg) {
  const W = 512, H = 1024, cols = 9, rows = 22;
  const bc = makeCanvas(W, H), ec = makeCanvas(W, H);
  const bx = bc.getContext('2d'), ex = ec.getContext('2d');
  bx.fillStyle = cfg.bg; bx.fillRect(0, 0, W, H);
  ex.fillStyle = '#000'; ex.fillRect(0, 0, W, H);
  const cw = W / cols, ch = H / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * cw, y = r * ch;
      // glass pane
      const tone = rnd(0, 1);
      bx.fillStyle = tone > 0.82 ? cfg.glassB : cfg.glassA;
      bx.fillRect(x + 2, y + 2, cw - 4, ch - 4);
      if (tone > 0.55) {
        bx.fillStyle = 'rgba(160,205,240,0.055)';
        bx.beginPath();
        bx.moveTo(x + 3, y + ch * 0.62);
        bx.lineTo(x + cw * 0.58, y + 3);
        bx.lineTo(x + cw * 0.82, y + 3);
        bx.lineTo(x + 3, y + ch * 0.83);
        bx.closePath(); bx.fill();
      }
      // mullion frame
      bx.strokeStyle = cfg.frame; bx.lineWidth = 1.5;
      bx.strokeRect(x + 1.5, y + 1.5, cw - 3, ch - 3);
      // lit panes: inset from the frame, with a few drawn curtains
      if (RNG() < cfg.ratio) {
        const col = pick(cfg.lit);
        ex.fillStyle = col;
        const insetX = 7, insetY = 8;
        if (RNG() < 0.2) {
          ex.fillRect(x + insetX, y + ch * 0.5, cw - insetX * 2, ch * 0.5 - 8);
        } else if (RNG() < 0.16) {
          ex.fillRect(x + insetX, y + insetY, cw * 0.46, ch - insetY * 2);
        } else {
          ex.fillRect(x + insetX, y + insetY, cw - insetX * 2, ch - insetY * 2);
        }
        if (RNG() < 0.3) {
          ex.fillStyle = 'rgba(0,0,0,0.45)';
          ex.fillRect(x + insetX, y + insetY, cw * 0.2, ch - insetY * 2);
        }
      }
    }
    bx.fillStyle = cfg.slab;
    bx.fillRect(0, r * ch, W, 3.5);
    ex.fillStyle = 'rgba(0,0,0,0.6)';
    ex.fillRect(0, r * ch, W, 3.0);
    if (r % 6 === 0) {
      // a whole office floor lit here and there
      for (let c = 0; c < cols; c++) {
        if (RNG() < 0.5) {
          ex.fillStyle = pick(cfg.lit);
          ex.globalAlpha = 0.38;
          ex.fillRect(c * cw + 7, r * ch + 8, cw - 14, ch - 16);
          ex.globalAlpha = 1;
        }
      }
    }
  }
  // vertical structural piers
  for (let c = 0; c <= cols; c++) {
    bx.fillStyle = cfg.pier;
    bx.fillRect(c * cw - 1.5, 0, 3, H);
  }
  if (cfg.strip) {
    bx.fillStyle = cfg.strip;
    bx.fillRect(6, 0, 7, H);
    bx.fillRect(W - 13, 0, 7, H);
    ex.fillStyle = cfg.strip;
    ex.fillRect(6, 0, 7, H);
    ex.fillRect(W - 13, 0, 7, H);
  }
  const base = texFrom(bc), emit = texFrom(ec);
  base.wrapS = base.wrapT = THREE.RepeatWrapping;
  emit.wrapS = emit.wrapT = THREE.RepeatWrapping;
  return { base, emit, ratio: cfg.ratio };
}

// One material per volume, with UVs scaled per face. Six material groups per
// box would cost six draw calls; this keeps each building volume at one.
function scaleBoxUV(geo, w, h, d) {
  const uv = geo.attributes.uv;
  const faceScale = [d / 4, d / 4, w / 4, w / 4, d / 4, d / 4];
  for (let f = 0; f < 6; f++) {
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      uv.setXY(i, uv.getX(i) * faceScale[f], uv.getY(i) * (h / 10));
    }
  }
  uv.needsUpdate = true;
}

function facadeBox(parent, style, w, h, d, x, y, z, ry = 0, opts = {}) {
  const geo = new THREE.BoxGeometry(w, h, d);
  scaleBoxUV(geo, w, h, d);
  const mat = makeFacadeMat(style);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y + h / 2, z);
  mesh.rotation.set(opts.rx || 0, ry, opts.rz || 0);
  parent.add(mesh);
  if (opts.outline !== false) {
    const o = new THREE.Mesh(geo, outlineMat);
    o.position.copy(mesh.position);
    o.rotation.copy(mesh.rotation);
    parent.add(o);
  }
  // a real roof cap hides the window texture on the top face
  const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.05, 0.06, d + 0.05), matRoofCool);
  cap.position.set(x, y + h - 0.02, z);
  cap.rotation.set(opts.rx || 0, ry, opts.rz || 0);
  parent.add(cap);
  return { mesh, mats: [mat] };
}

function boxMesh(parent, w, h, d, x, y, z, mat, opts = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, y, z);
  if (opts.ry) m.rotation.y = opts.ry;
  if (opts.rz) m.rotation.z = opts.rz;
  if (opts.rx) m.rotation.x = opts.rx;
  parent.add(m);
  if (opts.outline) {
    const o = new THREE.Mesh(g, outlineMat);
    o.position.copy(m.position); o.rotation.copy(m.rotation);
    parent.add(o);
  }
  return m;
}

function setLightFlicker(t) {
  for (const e of lightEntries) {
    const p = clamp((t - e.start) / 0.7, 0, 1);
    let v = 0;
    if (p > 0) {
      const flick = p < 1 ? (Math.sin(t * 72 + e.start * 11) > -0.15 ? 1 : 0.16) * (0.45 + 0.55 * p) : 1;
      v = 1.22 * flick;
    }
    for (const m of e.mats) m.emissiveIntensity = v * 0.95;
  }
}

}

/* ---------- hero towers ---------- */
function makeTower(o) {
  const g = new THREE.Group();
  g.position.set(o.x, 0, o.z);
  g.rotation.y = o.rot || 0;
  city.add(g);
  let y = 0;
  const mats = [];
  let maxW = 0, maxD = 0;
  for (const tier of o.tiers) {
    const fb = facadeBox(g, tier.style || o.style, tier.w, tier.h, tier.d, 0, y, 0);
    mats.push(...fb.mats);
    maxW = Math.max(maxW, tier.w); maxD = Math.max(maxD, tier.d);
    // one metallic cornice per tier instead of four separate bars
    boxMesh(g, tier.w + 0.08, 0.09, tier.d + 0.08, 0, y + tier.h - 0.075, 0, tier.trim || matGoldDim);
    y += tier.h;
  }
  // crown / roof equipment
  const top = y;
  const roofW = o.tiers[o.tiers.length - 1].w;
  const roofD = o.tiers[o.tiers.length - 1].d;
  boxMesh(g, roofW * 0.92, 0.12, roofD * 0.92, 0, top + 0.06, 0, matRoofCool);
  if (o.mech !== false) {
    boxMesh(g, roofW * 0.34, 0.5, roofD * 0.3, roofW * 0.12, top + 0.3, -roofD * 0.08, matMetal);
    const ant = boxMesh(g, 0.06, 1.1, 0.06, -roofW * 0.2, top + 0.65, 0, matMetalDark);
    addBeacon(g, -roofW * 0.2, top + 1.2, 0);
  }
  if (o.stripe) {
    const stripeMat = o.stripe === 'pink' ? matNeonPink : o.stripe === 'gold' ? matNeonGold : matNeonCyan;
    boxMesh(g, 0.055, top * 0.82, 0.055, roofW * 0.48, top * 0.45, roofD * 0.48, stripeMat);
    boxMesh(g, 0.055, top * 0.82, 0.055, -roofW * 0.48, top * 0.45, -roofD * 0.48, stripeMat);
  }
  addPop(g, o.delay ?? 2.5, 1.12, 1.5);
  markHeight(o.x, o.z, maxW, maxD, top, o.rot || 0);
  registerLights(mats, (o.delay ?? 2.5) + 1.22);
  return g;
}

// China Zun: a waisted, rounded-square tower built as a loft
function makeZun() {
  const g = new THREE.Group();
  g.position.set(1.55, 0, -1.5);
  city.add(g);
  const podium = facadeBox(g, STYLE_DIM, 4.4, 1.1, 4.4, 0, 0, 0, 0, { top: matStone });
  const mats = [...podium.mats];
  boxMesh(g, 4.65, 0.16, 4.65, 0, 1.05, 0, matGoldDim);
  const H = 11.4, R = 1.62;
  const profile = [1.0, 0.965, 0.87, 0.79, 0.775, 0.83, 0.9, 0.945];
  const rings = 26, segs = 36;
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i <= rings; i++) {
    const t = i / rings;
    const k = t * (profile.length - 1);
    const i0 = Math.floor(k), f = k - i0;
    const fs = f * f * (3 - 2 * f);
    const rr = R * lerp(profile[i0], profile[Math.min(profile.length - 1, i0 + 1)], fs);
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * Math.PI * 2;
      const co = Math.cos(a), si = Math.sin(a);
      const e = 2 / 3.1;
      const px = Math.sign(co) * Math.pow(Math.abs(co), e) * rr;
      const pz = Math.sign(si) * Math.pow(Math.abs(si), e) * rr;
      pos.push(px, 1.1 + t * H, pz);
      uvs.push(s / segs * 2.4, t * 2.1);
    }
  }
  for (let i = 0; i < rings; i++) {
    for (let s = 0; s < segs; s++) {
      const a = i * (segs + 1) + s, b = a + 1, c = a + segs + 1, d = c + 1;
      idx.push(a, d, b, a, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mat = makeFacadeMat(STYLE_ZUN, R * 2.4, H);
  const flatGeo = geo.toNonIndexed();
  flatGeo.computeVertexNormals();
  const mesh = new THREE.Mesh(flatGeo, mat);
  g.add(mesh);
  const o = new THREE.Mesh(geo, outlineMat);
  g.add(o);
  mats.push(mat);
  // crown
  const crown = new THREE.Mesh(new THREE.TorusGeometry(R * 0.82, 0.045, 6, 40), matGold);
  crown.rotation.x = Math.PI / 2;
  crown.position.y = 1.1 + H + 0.05;
  g.add(crown);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    const sx = Math.cos(a) * R * 0.84, sz = Math.sin(a) * R * 0.84;
    boxMesh(g, 0.035, 0.55, 0.035, sx, 1.1 + H + 0.3, sz, matGoldDim);
  }
  const beacon = addBeacon(g, 0, 1.1 + H + 0.7, 0);
  addGlow(g, 0xffd49a, 0, 1.1 + H * 0.45, 0, 6, 0.10);
  markHeight(1.55, -1.5, 4.4, 4.4, 1.2);
  markHeight(1.55, -1.5, 3.3, 3.3, 1.1 + H);
  addPop(g, 2.35, 1.18, 1.5);
  registerLights(mats, 3.55);
  return g;
}

/* ---------- landmark: Temple of Heaven ---------- */
function gableRoofGeo(w, d, h) {
  const hw = w / 2, hd = d / 2;
  const p = [
    -hw, h, 0, hw, h, 0,
    -hw, 0, -hd, hw, 0, -hd,
    -hw, 0, hd, hw, 0, hd,
  ];
  const idx = [
    0, 4, 5, 0, 5, 1,
    0, 2, 3, 0, 3, 1,
    0, 2, 4, 1, 5, 3,
    2, 3, 5, 2, 5, 4,
  ];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([
    0, 1, 1, 1, 0, 0, 1, 0, 0, 0, 1, 0,
  ], 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

function chineseRoof(radius, height, segments = 32) {
  const pts = [];
  pts.push(new THREE.Vector2(radius, 0.12));
  pts.push(new THREE.Vector2(radius * 0.99, 0.035));
  pts.push(new THREE.Vector2(radius * 0.93, 0.0));
  pts.push(new THREE.Vector2(radius * 0.78, height * 0.22));
  pts.push(new THREE.Vector2(radius * 0.55, height * 0.52));
  pts.push(new THREE.Vector2(radius * 0.3, height * 0.78));
  pts.push(new THREE.Vector2(radius * 0.1, height * 0.94));
  pts.push(new THREE.Vector2(0.02, height));
  return new THREE.LatheGeometry(pts, segments);
}

function makeTemple() {
  const g = new THREE.Group();
  g.position.set(-12.8, 0, -10.4);
  city.add(g);
  const stoneBatch = new Batch();
  const goldBatch = new Batch();
  // terrace
  for (let i = 0; i < 3; i++) {
    const r = 3.45 - i * 0.42;
    const y = 0.12 + i * 0.28;
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.08, 0.3, 48), i === 2 ? matMarble : matStoneLight);
    disc.position.y = y + 0.15;
    g.add(disc);
    // balustrade posts and rail
    const n = 32;
    for (let k = 0; k < n; k++) {
      const a = k / n * Math.PI * 2;
      const px = Math.cos(a) * (r - 0.1), pz = Math.sin(a) * (r - 0.1);
      if (pz > 0 && Math.abs(px) < 1.5 && i === 2) continue; // stair opening
      stoneBatch.add(new THREE.BoxGeometry(0.075, 0.3, 0.075), matMarble, TRS(px, y + 0.42, pz));
    }
    const rail = new THREE.Mesh(new THREE.TorusGeometry(r - 0.1, 0.026, 5, 48), matMarble);
    rail.rotation.x = Math.PI / 2;
    rail.position.y = y + 0.57;
    g.add(rail);
  }
  // southern stair
  for (let i = 0; i < 6; i++) {
    const step = boxMesh(g, 2.9 - i * 0.12, 0.12, 0.42, 0, 0.16 + i * 0.12, 3.35 + i * 0.36, matMarble);
  }
  // hall drum + columns
  const hallY = 1.0;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.45, 1.5, 32), matRedLacquer);
  body.position.y = hallY + 0.75;
  g.add(body);
  const bodyOutline = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.45, 1.5, 32), outlineMat);
  bodyOutline.position.copy(body.position);
  g.add(bodyOutline);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    const px = Math.cos(a) * 1.62, pz = Math.sin(a) * 1.62;
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.075, 1.35, 8), matRedLacquer);
    c.position.set(px, hallY + 0.68, pz);
    g.add(c);
    goldBatch.add(new THREE.BoxGeometry(0.16, 0.08, 0.16), matGold, TRS(px, hallY + 1.34, pz));
  }
  // doors, gold lattices
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI * 0.25;
    const px = Math.cos(a) * 1.43, pz = Math.sin(a) * 1.43;
    const door = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.8), matWindowWarm);
    door.position.set(px, hallY + 0.72, pz);
    door.lookAt(px * 2, hallY + 0.72, pz * 2);
    g.add(door);
  }
  // three roofs
  const roofDefs = [
    { r: 2.55, h: 0.88, y: hallY + 1.55 },
    { r: 2.12, h: 0.8, y: hallY + 2.55 },
    { r: 1.7, h: 0.7, y: hallY + 3.48 },
  ];
  roofDefs.forEach((rd, i) => {
    if (i > 0) {
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(1.08, 1.12, 0.55, 28), matRedLacquer);
      drum.position.y = rd.y - 0.32;
      g.add(drum);
      const band = new THREE.Mesh(new THREE.TorusGeometry(1.13, 0.035, 5, 36), matGold);
      band.rotation.x = Math.PI / 2;
      band.position.y = rd.y - 0.06;
      g.add(band);
    }
    const geo = chineseRoof(rd.r, rd.h, 40);
    const roof = new THREE.Mesh(geo, i === 1 ? matRoofBlue2 : matRoofBlue);
    roof.position.y = rd.y + 0.02;
    g.add(roof);
    const ro = new THREE.Mesh(geo, outlineMat);
    ro.position.copy(roof.position);
    g.add(ro);
    const eave = new THREE.Mesh(new THREE.TorusGeometry(rd.r * 0.96, 0.035, 6, 48), matGold);
    eave.rotation.x = Math.PI / 2;
    eave.position.y = rd.y + 0.07;
    g.add(eave);
    // tile ends
    for (let k = 0; k < 28; k++) {
      const a = k / 28 * Math.PI * 2;
      goldBatch.add(new THREE.BoxGeometry(0.055, 0.055, 0.09), matGoldDim,
        TRS(Math.cos(a) * rd.r * 0.97, rd.y + 0.08, Math.sin(a) * rd.r * 0.97, 0, -a, 0));
    }
  });
  // finial
  const finial = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 8), matGold);
  finial.position.y = hallY + 4.38;
  g.add(finial);
  const spire = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.55, 8), matGold);
  spire.position.y = hallY + 4.75;
  g.add(spire);
  stoneBatch.commit(g);
  goldBatch.commit(g);

  // warm worship light
  const warm = new THREE.PointLight(0xffae62, 130, 16, 2);
  warm.position.set(0, 2.7, 1.2);
  g.add(warm);
  addGlow(g, 0xffb061, 0, 2.2, 0, 3.0, 0.16);
  addGlow(g, 0xffd08a, 0, 3.4, 0, 1.6, 0.22);

  // circular wall + gate
  const wallBatch = new Batch();
  for (const [a0, a1] of [[-1.22, 1.22], [1.36, 4.92]]) {
    const arc = new THREE.Mesh(
      new THREE.CylinderGeometry(5.9, 5.9, 0.55, 64, 1, true, a0, a1 - a0),
      matBrickDark
    );
    arc.position.y = 0.38;
    g.add(arc);
  }
  // gate
  const gate = new THREE.Group();
  gate.position.set(0, 0, 5.9);
  boxMesh(gate, 0.42, 1.2, 0.42, -0.85, 0.6, 0, matRedLacquer);
  boxMesh(gate, 0.42, 1.2, 0.42, 0.85, 0.6, 0, matRedLacquer);
  const gateRoof = new THREE.Mesh(gableRoofGeo(2.5, 1.2, 0.6), matRoofBlue);
  gateRoof.position.y = 1.25;
  gate.add(gateRoof);
  boxMesh(gate, 1.7, 0.16, 0.2, 0, 1.2, 0, matGoldDim);
  g.add(gate);

  g.scale.setScalar(0.82);
  markHeight(-12.8, -10.4, 5.7, 5.7, 0.85);
  markHeight(-12.8, -10.4, 4.2, 4.2, 4.9);
  addPop(g, 1.02, 1.25, 1.5);
  return g;
}

/* ---------- landmark: Great Wall ridge, right rear ---------- */
function ridgeHeight(x, z) {
  const across = Math.exp(-Math.pow((z + 17.1) / 1.85, 2));
  const along = 0.58 + 0.34 * Math.sin(x * 0.58 + 0.7) + 0.13 * Math.sin(x * 1.7);
  return 0.18 + 6.15 * across * along + Math.sin(x * 2.3 + z * 1.1) * 0.16;
}
function makeGreatWall() {
  const g = new THREE.Group();
  g.name = 'greatWall';
  city.add(g);
  // a taller, darker ridge behind gives the wall a mountain to sit against
  const back = new THREE.PlaneGeometry(8.6, 3.6, 34, 16);
  back.rotateX(-Math.PI / 2);
  const bp = back.attributes.position;
  for (let i = 0; i < bp.count; i++) {
    const lx = bp.getX(i), lz = bp.getZ(i);
    const wx = 16.8 + lx, wz = -19.35 + lz;
    const crest = Math.exp(-Math.pow((wz + 19.4) / 1.1, 2));
    bp.setY(i, 2.2 + 6.2 * crest * (0.65 + 0.25 * Math.sin(wx * 0.8 + 1.7)) + Math.sin(wx * 2.1) * 0.2);
  }
  back.computeVertexNormals();
  const backFlat = back.toNonIndexed();
  backFlat.computeVertexNormals();
  const backRidge = new THREE.Mesh(backFlat, toon(0x121f2e, { snowStrength: 1.1 }));
  backRidge.position.set(16.8, 0, -19.35);
  g.add(backRidge);

  const geo = new THREE.PlaneGeometry(6.4, 5.2, 30, 22);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const lx = p.getX(i), lz = p.getZ(i);
    p.setY(i, ridgeHeight(16.9 + lx, -17.2 + lz));
  }
  geo.computeVertexNormals();
  const flat = geo.toNonIndexed();
  flat.computeVertexNormals();
  const ridge = new THREE.Mesh(flat, toon(0x2b3d52, { snowStrength: 1.25 }));
  ridge.position.set(16.9, 0, -17.2);
  g.add(ridge);

  const wallBatch = new Batch();
  const stone = toon(0xa29782, { snowStrength: 1.3 });
  const stoneTop = toon(0xc6b79c, { snowStrength: 1.35 });
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const x = 14.8 + i * 0.4;
    const z = -17.05 + Math.sin(i * 0.52) * 0.62;
    pts.push({ x, z, y: ridgeHeight(x, z) });
  }
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz) + 0.1;
    const ang = Math.atan2(dx, dz);
    const cy = (a.y + b.y) / 2 + 0.38;
    wallBatch.add(new THREE.BoxGeometry(0.54, 0.86, len), stone, TRS((a.x + b.x) / 2, cy, (a.z + b.z) / 2, 0, ang, 0));
    wallBatch.add(new THREE.BoxGeometry(0.7, 0.1, len), stoneTop, TRS((a.x + b.x) / 2, cy + 0.48, (a.z + b.z) / 2, 0, ang, 0));
    // crenellations on both edges
    for (const side of [-1, 1]) {
      for (let k = -1; k <= 1; k++) {
        const ox = Math.cos(ang) * side * 0.26 + Math.sin(ang) * k * (len / 3.2);
        const oz = -Math.sin(ang) * side * 0.26 + Math.cos(ang) * k * (len / 3.2);
        wallBatch.add(new THREE.BoxGeometry(0.13, 0.28, 0.2), stone, TRS((a.x + b.x) / 2 + ox, cy + 0.67, (a.z + b.z) / 2 + oz, 0, ang, 0));
      }
    }
  }
  // warm lanterns every few metres so the wall line reads at night
  for (let i = 1; i < pts.length - 1; i += 2) {
    const a = pts[i];
    addGlow(g, 0xffb36a, a.x, a.y + 0.8, a.z + 0.4, 1.15, 0.46);
    boxMesh(g, 0.09, 0.17, 0.09, a.x, a.y + 0.76, a.z + 0.4, matLamp);
    boxMesh(g, 0.18, 0.05, 0.18, a.x, a.y + 0.93, a.z + 0.4, matGoldDim);
  }
  // watchtowers along the wall
  for (const [x0, i] of [[15.3, 3], [18.6, 10]]) {
    const z = -17.05 + Math.sin(i * 0.52) * 0.62;
    const x = x0;
    const baseY = ridgeHeight(x, z);
    boxMesh(g, 1.7, 1.9, 1.4, x, baseY + 1.15, z, stone, { outline: true });
    boxMesh(g, 1.85, 0.16, 1.55, x, baseY + 2.12, z, stoneTop);
    const r = new THREE.Mesh(gableRoofGeo(2.3, 1.9, 0.6), matTile);
    r.position.set(x, baseY + 2.14, z + 0.1);
    g.add(r);
    const ro = new THREE.Mesh(gableRoofGeo(2.3, 1.9, 0.6), outlineMat);
    ro.position.copy(r.position); g.add(ro);
    for (const dx of [-0.42, 0.42]) {
      boxMesh(g, 0.2, 0.3, 0.03, x + dx, baseY + 1.4, z + 0.715, matWindowWarm);
    }
    addGlow(g, 0xffb265, x, baseY + 1.4, z + 0.85, 1.2, 0.16);
    boxMesh(g, 0.035, 0.9, 0.035, x + 0.55, baseY + 2.6, z, matMetalDark);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.28), matRedLacquer);
    flag.position.set(x + 0.78, baseY + 2.85, z);
    flag.rotation.y = 0.2;
    g.add(flag);
  }
  wallBatch.commit(g);
  // a lit walkway edge traces the crenellated crest against the dark ridge
  const crest = pts.map(p => new THREE.Vector3(p.x, p.y + 1.12, p.z));
  const crestLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(crest),
    new THREE.LineBasicMaterial({ color: 0xf0d7a6, transparent: true, opacity: 0.72, depthWrite: false })
  );
  g.add(crestLine);
  // a few pines on the ridge, and a warm light so the wall reads at night
  for (const x of [15.0, 16.9, 19.0]) {
    const z = -17.05 + Math.sin(((x - 14.8) / 0.4) * 0.52) * 0.62;
    const y = ridgeHeight(x, z);
    for (let i = 0; i < 3; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry((0.55 - i * 0.13), (1.1 - i * 0.2), 6), matCypress);
      cone.position.set(x, y + 0.75 + i * 0.62, z + 0.5);
      g.add(cone);
    }
  }
  addGlow(g, 0xffbd7a, 12.6, 6.0, -16.2, 4.0, 0.07);
  addPop(g, 1.1, 1.3, 1.5);
  markHeight(16.9, -17.1, 6.4, 4.8, 7.8);
  return g;
}

/* ---------- hutong district ---------- */
function makeHutongHouse(batchWall, batchRoof, batchDoor, batchWindow, x, z, w = 2.55, d = 2.15) {
  const wh = 1.02;
  batchWall.add(new THREE.BoxGeometry(w, wh, d), matBrick, TRS(x, wh / 2, z), true);
  // roof
  batchRoof.add(gableRoofGeo(w + 0.32, d + 0.32, 0.58), matTile, TRS(x, wh, z), true);
  // ridge tiles and eave lips
  batchRoof.add(new THREE.BoxGeometry(w + 0.36, 0.09, 0.12), matRoofCool, TRS(x, wh + 0.58, z));
  batchRoof.add(new THREE.BoxGeometry(w + 0.32, 0.06, 0.08), matRoofCool, TRS(x, wh + 0.02, z + (d + 0.32) / 2));

/* ---------- signs ---------- */
function makeSignPlane(text, w, h, color, bg, vertical = false) {
  const cw = vertical ? 256 : 768;
  const ch = vertical ? 768 : 192;
  const c = makeCanvas(cw, ch), x = c.getContext('2d');
  x.fillStyle = '#' + bg.toString(16).padStart(6, '0');
  x.fillRect(0, 0, cw, ch);
  const col = '#' + color.toString(16).padStart(6, '0');
  x.strokeStyle = col; x.globalAlpha = 0.9; x.lineWidth = 8;
  x.strokeRect(7, 7, cw - 14, ch - 14);
  x.globalAlpha = 0.35; x.lineWidth = 2;
  x.strokeRect(18, 18, cw - 36, ch - 36);
  x.globalAlpha = 1;
  x.fillStyle = col;
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  const fam = '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
  if (vertical) {
    const chars = [...text];
    const cell = (ch - 70) / chars.length;
    const fs = Math.min(cw * 0.62, cell * 0.8);
    x.font = `900 ${fs}px ${fam}`;
    chars.forEach((ch2, i) => {
      x.globalAlpha = 0.22; x.fillStyle = '#000000';
      x.fillText(ch2, cw / 2 + 3, 35 + cell * (i + 0.5) + 3);
      x.globalAlpha = 1;
      x.fillStyle = col;
      x.fillText(ch2, cw / 2, 35 + cell * (i + 0.5));
    });
  } else {
    let fs = ch * 0.60;
    if (text.length >= 3) fs = ch * 0.46;
    if (text.length >= 4) fs = ch * 0.36;
    x.font = `900 ${fs}px ${fam}`;
    x.globalAlpha = 0.22; x.fillStyle = '#000000';
    x.fillText(text, cw / 2 + 4, ch / 2 + 4);
    x.globalAlpha = 1; x.fillStyle = col;
    x.fillText(text, cw / 2, ch / 2);
  }
  const tex = texFrom(c);
  return new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, side: THREE.DoubleSide })
  );
}

function addSign(parent, text, x, y, z, w, h, opts = {}) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = opts.ry || 0;
  const back = new THREE.Mesh(new THREE.BoxGeometry(w * 1.08, h * 1.10, 0.06), matDark);
  back.position.z = -0.045;
  g.add(back);
  const plane = makeSignPlane(text, w, h, opts.color ?? 0x7fe8ff, opts.bg ?? 0x0b1722, opts.vertical);
  g.add(plane);
  addGlow(g, opts.color ?? 0x7fe8ff, 0, 0, -0.12, Math.max(w, h) * 1.8, 0.16);
  parent.add(g);
  if (opts.flicker) signFlicker.push({ mat: plane.material, base: new THREE.Color(0xffffff), phase: rnd(0, 10) });
  return g;
}

function makeTrees() {
  const g = new THREE.Group();
  city.add(g);
  const trunk = new Batch();
  const canopies = [new Batch(), new Batch(), new Batch()];
  const lobes = [new Batch(), new Batch(), new Batch()];
  const cypressBatch = new Batch();
  const pits = new Batch();
  const mats = [matTreeA, matTreeB, matTreeC];
  const lobeMats = [matTreeA2, matTreeB2, matTreeC2];
  const canopyGeo = new THREE.SphereGeometry(1, 8, 6);

  function tree(x, z, s = 1, variant = 0) {
    const vi = variant % 3;
    trunk.add(new THREE.CylinderGeometry(0.065, 0.11, 1.7 * s, 5), matTrunk,
      TRS(x, 0.28 + 0.85 * s, z, 0, 0, rnd(-0.035, 0.035), s, s, s));
    // one clean silhouette per tree; smaller lobes add shape without ink
    canopies[vi].add(canopyGeo, mats[vi],
      TRS(x, 0.28 + 2.0 * s, z, 0, rnd(0, 3), 0, 0.98 * s, 0.82 * s, 0.95 * s), true);
    const ang = rnd(0, 6.28);
    lobes[vi].add(new THREE.SphereGeometry(1, 6, 4), lobeMats[vi],
      TRS(x + Math.cos(ang) * 0.62 * s, 0.28 + 2.14 * s, z + Math.sin(ang) * 0.5 * s,
        0, rnd(0, 3), 0, 0.52 * s, 0.42 * s, 0.5 * s));
    lobes[vi].add(new THREE.SphereGeometry(1, 6, 4), lobeMats[vi],
      TRS(x - Math.cos(ang) * 0.5 * s, 0.28 + 1.9 * s, z - Math.sin(ang) * 0.55 * s,
        0, rnd(0, 3), 0, 0.46 * s, 0.38 * s, 0.45 * s));
    pits.add(new THREE.CylinderGeometry(0.34 * s, 0.34 * s, 0.025, 10), matMetalDark, TRS(x, 0.287, z));
  }
  function cypress(x, z, s = 1) {
    trunk.add(new THREE.CylinderGeometry(0.06, 0.1, 0.8 * s, 5), matTrunk, TRS(x, 0.28 + 0.4 * s, z));
    for (let i = 0; i < 3; i++) {
      cypressBatch.add(new THREE.ConeGeometry((0.66 - i * 0.15) * s, (1.35 - i * 0.24) * s, 7), matCypress,
        TRS(x, 0.28 + (0.95 + i * 0.64) * s, z), true);
    }
  }

  [-18.6, 15.3].forEach((x, i) => tree(x, 10.55, 0.80 + (i % 2) * 0.06, i));
  [-15.6, 0.8, 15.2].forEach((x, i) => tree(x, 18.35, 0.74, i + 1));
  [[12.4, 1.2], [2.4, 7.2], [10.1, 5.6]].forEach((p, i) => tree(p[0], p[1], 0.84, i));
  [[-16.9, 2.9], [-11.1, 6.4]].forEach((p, i) => tree(p[0], p[1], 0.7, i + 2));
  // dark pines along the far edge
  for (let i = 0; i < 5; i++) cypress(-18.4 + i * 4.0, -18.5, 0.74 + (i % 3) * 0.08);
  // temple cypresses
  for (const a of [-2.55, -2.0, 1.35, 1.95, 2.5]) {
    cypress(-12.8 + Math.cos(a) * 7.2, -10.4 + Math.sin(a) * 7.2, 0.95);
  }
  trunk.commit(g);
  canopies.forEach(b => b.commit(g));
  lobes.forEach(b => b.commit(g));
  cypressBatch.commit(g);
  pits.commit(g);
  addPop(g, 4.45, 1.15, 1.5);
  return g;
}

function personGeometry(coat, skin, pants) {
  const parts = [];
  const add = (geo, hex, matrix) => {
    const g = geo.toNonIndexed();
    g.applyMatrix4(matrix);
    const c = new THREE.Color(hex).convertSRGBToLinear();
    const n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    parts.push(g);
  };
  add(new THREE.BoxGeometry(0.14, 0.58, 0.17), pants, TRS(-0.09, 0.3, 0));
  add(new THREE.BoxGeometry(0.14, 0.58, 0.17), pants, TRS(0.09, 0.3, 0));
  add(new THREE.CylinderGeometry(0.18, 0.22, 0.72, 7), coat, TRS(0, 0.97, 0));
  add(new THREE.BoxGeometry(0.5, 0.14, 0.18), coat, TRS(0, 1.3, 0));
  add(new THREE.SphereGeometry(0.115, 8, 6), skin, TRS(0, 1.53, 0));
  add(new THREE.CylinderGeometry(0.1, 0.12, 0.12, 8), coat, TRS(0, 1.43, 0));
  const merged = mergeGeometries(parts, false);
  merged.computeBoundingSphere();
  return merged;
}

function updatePeople(t, rain) {
  for (const p of people) {
    const len = Math.hypot(p.bx - p.ax, p.bz - p.az);
    if (len < 0.001) continue;
    const u0 = (t * p.speed / len + p.phase) % 2;
    const u = u0 > 1 ? 2 - u0 : u0;
    const x = lerp(p.ax, p.bx, u);
    const z = lerp(p.az, p.bz, u);
    p.group.position.set(x, p.y, z);
    const forward = u0 <= 1 ? 1 : -1;
    const want = Math.atan2((p.bx - p.ax) * forward, (p.bz - p.az) * forward);
    p.group.rotation.y = want;
    p.group.position.y = p.y + Math.abs(Math.sin(t * 6.2 + p.phase * 9)) * 0.025;
    p.umbrella.visible = rain > 0.25;
  }
}

  const cx = 6.5, cz = 16.1;
  const s = new THREE.Shape();
  PUDDLE_PTS.forEach(([x, z], i) => {
    const px = cx + (x - cx) * scale, pz = cz + (z - cz) * scale;
    if (i === 0) s.moveTo(px, -pz); else s.lineTo(px, -pz);

  s.closePath();
  return s;

  s.renderOrder = 9;
  scene.add(s);
  fwGlows.push({ sprite: s, age: 9 });
}
function flashAt(x, y, z, color) {
  const g = fwGlows.reduce((a, b) => (a.age > b.age ? a : b), fwGlows[0]);
  g.age = 0;
  g.sprite.visible = true;
  g.sprite.position.set(x, y, z);
  g.sprite.material.color.setHex(color);
  g.sprite.material.opacity = 0.78;
  g.sprite.scale.set(3.0, 3.0, 1);
}
let fwCursor = 0, fwBursts = 0;
window.__fw = { geo: fwGeo, mat: fwMat, count: () => fwBursts };
const FW_PALETTES = [
  [0xffd27a, 0xffb04f, 0xfff0c0],
  [0xff7d6e, 0xffa08a, 0xffd9c2],
  [0xffc46b, 0xffe3a8, 0xfff4d6],
  [0xff8fc4, 0xffc0d9, 0xffe0ee],
  [0x9fe8ff, 0xc8f4ff, 0x5ecbe6],
];

function spawnBurst() {
  const dc = rnd(170, 255);
  const p = rnd(0.045, 0.13);
  const lateral = (RNG() < 0.5 ? -1 : 1) * rnd(0.62, 0.78);
  const shift = (1 - 2 * BASE_SCREEN_Y) + HEIGHT_FACTOR / TAN_HALF;
  const tanT = (1 - 2 * p - shift) * TAN_HALF;
  const fx = -Math.sin(cam.az), fz = -Math.cos(cam.az);
  const rx = Math.cos(cam.az), rz = -Math.sin(cam.az);
  const lateralWorld = lateral * dc * TAN_HALF * camera.aspect;
  const cx = camera.position.x + fx * dc + rx * lateralWorld;
  const cz = camera.position.z + fz * dc + rz * lateralWorld;
  const cy = camera.position.y + dc * tanT;
  const pal = RNG() < 0.5 ? FW_PALETTES[0] : RNG() < 0.55 ? FW_PALETTES[2] : pick(FW_PALETTES);
  const count = 108 + Math.floor(RNG() * 12);
  const radius = rnd(0.8, 1.3);
  for (let k = 0; k < count; k++) {
    const i = fwCursor = (fwCursor + 1) % FW_N;
    const u = RNG() * 2 - 1;
    const a = RNG() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    const sp = radius * rnd(0.85, 1.35);
    fwPos[i * 3] = cx + rnd(-0.2, 0.2);
    fwPos[i * 3 + 1] = cy + rnd(-0.2, 0.2);
    fwPos[i * 3 + 2] = cz + rnd(-0.2, 0.2);
    fwVel[i * 3] = Math.cos(a) * s * sp;
    fwVel[i * 3 + 1] = u * sp;
    fwVel[i * 3 + 2] = Math.sin(a) * s * sp;
    const c = new THREE.Color(pick(pal));
    fwCol[i * 3] = c.r; fwCol[i * 3 + 1] = c.g; fwCol[i * 3 + 2] = c.b;
    fwBirth[i] = elapsed;
    fwLife[i] = rnd(2.2, 2.9);
    fwSize[i] = rnd(0.12, 0.2);
  }
  fwBursts++;
  flashAt(cx, cy, cz, pal[0]);
  fwLight.color.setHex(pick(pal));
  fwLight.userData.pulse = 1;
  fwLight.position.set(cam.panX * 0.5, 32, cam.panZ * 0.5 + 26);
  fwGeo.attributes.position.needsUpdate = true;
  fwGeo.attributes.aVel.needsUpdate = true;
  fwGeo.attributes.aColor.needsUpdate = true;
  fwGeo.attributes.aBirth.needsUpdate = true;
  fwGeo.attributes.aLife.needsUpdate = true;
  fwGeo.attributes.aSize.needsUpdate = true;
}

/* ---------- weather state + integration ---------- */
const weather = {
  rain: 0, snow: 0, cover: 0,
  started: false, locked: null, lockUntil: 0,
  burstTimer: 0.55,
};
window.__weather = weather;

function updateWeather(dt, t) {
  const show = t - ASSEMBLY_END - 0.6;
  const active = show > 0;
  if (active) {
    if (!weather.started) weather.started = true;
    const cycle = show % 78;
    let rt = 0, st = 0;
    if (cycle < 30) rt = 1;
    else if (cycle < 35) { rt = 1 - (cycle - 30) / 5; st = (cycle - 30) / 5; }
    else if (cycle < 68) st = 1;
    else if (cycle < 73) { st = 1 - (cycle - 68) / 5; rt = (cycle - 68) / 5; }
    else rt = 1;
    if (weather.locked && t < weather.lockUntil) {
      if (weather.locked === 'rain') { rt = 1; st = 0; }
      if (weather.locked === 'snow') { st = 1; rt = 0; }
    }
    weather.rain = damp(weather.rain, rt, 1.5, dt);
    weather.snow = damp(weather.snow, st, 1.5, dt);
    if (weather.snow > 0.35) weather.cover = clamp(weather.cover + dt * 0.072, 0, 1);
    else if (weather.rain > 0.35) weather.cover = clamp(weather.cover - dt * 0.11, 0, 1);
  } else {
    weather.rain = 0; weather.snow = 0; weather.cover = 0;
  }
  uSnow.value = weather.cover;

  const ps = renderer.domElement.height / (2 * TAN_HALF);
  splashMat.uniforms.uScale.value = ps;
  snowMat.uniforms.uScale.value = ps;
  fwMat.uniforms.uScale.value = ps;

  // rain
  rainMat.opacity = weather.rain * 0.50;
  rain.visible = weather.rain > 0.015;
  if (rain.visible) {
    splashesThisFrame = 0;
    const windX = WIND.x, windZ = WIND.y;
    for (let i = 0; i < RAIN_N; i++) {
      const vy = rainDrops.vy[i];
      rainDrops.x[i] += windX * dt;
      rainDrops.z[i] += windZ * dt;
      rainDrops.y[i] -= vy * dt;
      const x = rainDrops.x[i], z = rainDrops.z[i];
      const h = heightAt(x, z);
      if (rainDrops.y[i] <= h + 0.02 || rainDrops.y[i] < -2 || x < -23 || x > 23 || z < -23 || z > 23) {
        if (h > -1 && rainDrops.y[i] <= h + 0.02 && weather.rain > 0.2 && RNG() < 0.52) {
          const inPuddle = x > 0 && x < 13.4 && z > 12.3 && z < 19.1 && pointInPoly(x, z, PUDDLE_PTS);
          const sy = inPuddle ? 0.252 : (h < 0.3 ? 0.16 : h + 0.03);
          spawnSplash(x, sy, z);
        }
        resetDrop(i);
      }
      const y = rainDrops.y[i];
      const len = rainDrops.len[i];
      const tail = len / vy;
      const b = rainDrops.bright[i];
      const o = i * 6;
      rainPos[o] = x;
      rainPos[o + 1] = y;
      rainPos[o + 2] = z;
      rainPos[o + 3] = x - windX * tail * 0.55;
      rainPos[o + 4] = y + vy * tail;
      rainPos[o + 5] = z - windZ * tail * 0.55;
      const c = 0.42 + b * 0.55;
      rainCol[o] = 0.55 * c; rainCol[o + 1] = 0.72 * c; rainCol[o + 2] = 1.0 * c;
      rainCol[o + 3] = 0.55 * c; rainCol[o + 4] = 0.72 * c; rainCol[o + 5] = 1.0 * c;
    }
    rainGeo.attributes.position.needsUpdate = true;
    rainGeo.attributes.color.needsUpdate = true;
  }
  splashMat.uniforms.uTime.value = t;
  splashMat.uniforms.uOpacity.value = weather.rain * 0.9;
  if (splashDirty) {
    splashGeo.attributes.position.needsUpdate = true;
    splashGeo.attributes.aVel.needsUpdate = true;
    splashGeo.attributes.aBirth.needsUpdate = true;
    splashGeo.attributes.aLife.needsUpdate = true;
    splashGeo.attributes.aSize.needsUpdate = true;
    splashDirty = false;
  }
  ripples.visible = weather.rain > 0.05 && weather.cover < 0.85;
  rippleMat.uniforms.uTime.value = t;
  rippleMat.uniforms.uOpacity.value = weather.rain * (1 - weather.cover * 0.9);

  // snow
  snow.visible = weather.snow > 0.015;
  snowMat.uniforms.uTime.value = t;
  snowMat.uniforms.uOpacity.value = weather.snow * 0.92;
  snowGround.visible = weather.cover > 0.01;
  snowGround.material.opacity = weather.cover * 0.70;
  snowTracks.visible = weather.cover > 0.05;
  trackMat.opacity = weather.cover * 0.32;

  // light shafts breathe with the weather
  const shaftOp = 0.04 + weather.rain * 0.46 + weather.snow * 0.22;
  for (const m of shaftMats) m.opacity = shaftOp;

  // the puddle darkens and freezes over as snow settles
  if (window.__puddleShader) {
    window.__puddleShader.uniforms.uTime.value = t;
    window.__puddleShader.uniforms.uRain.value = weather.rain;
    window.__puddleShader.uniforms.uSnow.value = weather.cover;
    window.__puddleShader.uniforms.uOpacity.value = (0.38 + 0.62 * weather.rain) * (1 - weather.cover * 0.85) * clamp((t - ASSEMBLY_END) / 1.2, 0, 1);
  }
  puddleGroup.visible = t > ASSEMBLY_END + 0.2 && weather.cover < 0.62;
  if (window.__fakePuddles) window.__fakePuddles.visible = weather.cover < 0.62;

  for (const g of fwGlows) {
    if (!g.sprite.visible) continue;
    g.age += dt;
    g.sprite.material.opacity = 0.78 * Math.max(0, 1 - g.age / 1.8);
    const sc = 3.0 + g.age * 2.4;
    g.sprite.scale.set(sc, sc, 1);
    if (g.age > 1.8) g.sprite.visible = false;
  }

  // shared firework light
  if (fwLight.userData.pulse > 0) {
    fwLight.userData.pulse = Math.max(0, fwLight.userData.pulse - dt * 2.2);
    fwLight.intensity = 2400 * Math.pow(fwLight.userData.pulse, 3);
  } else fwLight.intensity = 0;

  // fireworks
  fwMat.uniforms.uTime.value = t;
  fwMat.uniforms.uOpacity.value = active ? 1 : 0;
  if (active && show > 0.7) {
    weather.burstTimer -= dt;
    if (weather.burstTimer <= 0) {
      spawnBurst();
      if (RNG() < 0.45) spawnBurst();
      weather.burstTimer = rnd(1.15, 1.85);
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') { weather.locked = 'rain'; weather.lockUntil = elapsed + 45; }
  if (e.key === 's' || e.key === 'S') { weather.locked = 'snow'; weather.lockUntil = elapsed + 45; }
});

/* fix light starts for signs */

const canvas = renderer.domElement;
let pointers = new Map();
let drag = null;
let pinchStart = 0;

function markInput() { cam.lastInput = elapsed; }

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  markInput();
  if (e.button === 2) {
    drag = { mode: 'pan', x: e.clientX, y: e.clientY };
  } else if (e.button === 0 && pointers.size === 1) {
    drag = { mode: 'orbit', x: e.clientX, y: e.clientY };
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
    drag = { mode: 'pinch' };
  }
  document.body.classList.add('dragging');
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;
  markInput();
  if (drag.mode === 'orbit') {
    const dx = e.clientX - drag.x;
    drag.x = e.clientX;
    cam.azTarget -= dx * 0.00105;
  } else if (drag.mode === 'pan') {
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    const mpp = (2 * cam.dist * TAN_HALF) / window.innerHeight;
    const rightX = Math.cos(cam.az), rightZ = -Math.sin(cam.az);
    const fwdX = -Math.sin(cam.az), fwdZ = -Math.cos(cam.az);
    cam.panXTarget = clamp(cam.panXTarget - rightX * dx * mpp * 0.85 + fwdX * dy * mpp * 1.2, -7, 7);
    cam.panZTarget = clamp(cam.panZTarget - rightZ * dx * mpp * 0.85 + fwdZ * dy * mpp * 1.2, -7, 7);
  } else if (drag.mode === 'pinch' && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchStart > 0) cam.distTarget = clamp(cam.distTarget * (pinchStart / d), DIST_MIN, DIST_MAX);
    pinchStart = d;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { drag = null; document.body.classList.remove('dragging'); }
  if (pointers.size === 1) { drag = { mode: 'orbit', x: [...pointers.values()][0].x, y: [...pointers.values()][0].y }; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  markInput();
  cam.distTarget = clamp(cam.distTarget * Math.exp(e.deltaY * 0.00085), DIST_MIN, DIST_MAX);
}, { passive: false });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  applyLensShift();
});

/* ---------- assembly / clock ---------- */
let elapsed = 0;
let last = performance.now();
const ASSEMBLY_END = 7.9;

function updateAssembly(t) {
  for (const it of popItems) {
    const p = clamp((t - it.delay) / it.dur, 0, 1);
    it.obj.position.y = it.baseY - it.drop * (1 - easeOutCubic(p));
    it.obj.visible = p > 0;
  }
}

function step(dt) {
  elapsed += dt;
  updateAssembly(elapsed);
  setLightFlicker(elapsed);
  for (const b of beaconItems) {
    const pulse = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(elapsed * 2.6 + b.phase), 5);
    b.sprite.material.opacity = 0.25 + pulse * 0.6;
  }
  for (const s of signFlicker) {
    const f = 0.82 + 0.18 * (Math.sin(elapsed * 23 + s.phase) > -0.55 ? 1 : 0.25);
    s.mat.color.setRGB(f, f, f);
  }
  if (window.__screen) {
    window.__screen.uniforms.uTime.value = elapsed;
    window.__screen.uniforms.uOn.value = clamp((elapsed - ASSEMBLY_END - 0.35) / 0.8, 0, 1);
  }
  puddleGroup.visible = elapsed > ASSEMBLY_END + 0.2;
  updateWeather(dt, elapsed);
  if (elapsed > ASSEMBLY_END) {
    const lifeT = elapsed - ASSEMBLY_END;
    updatePeople(lifeT, weather.rain);
    for (const car of cars) {
      const m = car.userData.mover;
      if (!m) continue;
      car.position.x += m.dir * m.speed * dt;
      if (m.dir > 0 && car.position.x > 22.5) car.position.x = -22.5;
      if (m.dir < 0 && car.position.x < -22.5) car.position.x = 22.5;
      car.rotation.y = m.dir > 0 ? 0 : Math.PI;
    }
  }
  // camera damping
  const targetAuto = (elapsed > ASSEMBLY_END && elapsed - cam.lastInput > 3.4) ? 0.00135 * dt : 0;
  cam.azTarget += targetAuto;
  cam.az = damp(cam.az, cam.azTarget, 9, dt);
  cam.dist = damp(cam.dist, cam.distTarget, 7, dt);
  cam.panX = damp(cam.panX, cam.panXTarget, 8, dt);
  cam.panZ = damp(cam.panZ, cam.panZTarget, 8, dt);
  placeCamera();
  skyRig.position.copy(camera.position);
  skyRig.quaternion.copy(camera.quaternion);
  if (window.__stars) window.__stars.uniforms.uTime.value = elapsed;
}

function render() {
  renderer.render(scene, camera);
}

function animate(now) {
  requestAnimationFrame(animate);
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  if (!window.__pause) step(dt);
  render();
}

// debug seek
window.__seek = (t) => {
  elapsed = 0; last = performance.now();
  for (let i = 0; i < t * 60; i++) step(1 / 60);
  render();
};
window.__ready = true;
render();
requestAnimationFrame(animate);
</script>
</body>
</html>
